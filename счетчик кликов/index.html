<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик кликов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <main class="main">
            <p class="count" id="count">0</p>
            <div class="main-buttons">
                <button class="increment" id="button-increment">+1</button>
                <button class="decrement" id="button-decrement">-1</button>
                <button class="reset" id="button-reset">Сброс</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
